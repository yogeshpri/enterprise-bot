replicaCount: 2

image:
  repository: enterprise-bot
  tag: "1.0"
  pullPolicy: IfNotPresent

config:
  appName: enterprise-bot
  version: "1.0"

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: demo.local
  path: /

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"
